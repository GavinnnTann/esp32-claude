[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; This board's chip is 16MB (esptool auto-detects it), but the esp32dev board
; definition assumes 4MB, which caps the app partition at ~1.31MB - we were
; already at 74% of it. The 16MB table gives a 6.25MB app partition.
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Exact versions, not ^ranges. These compile into firmware that is awkward to
; re-verify, and the caret was not hypothetical: NimBLE was written as ^2.2.3
; and had already resolved to 2.5.1 on this machine, so builds were not
; reproducible and a dependency changed under the project silently. Bump these
; deliberately, and reflash and check the display when you do.
lib_deps =
  lvgl/lvgl@9.5.0
  bodmer/TFT_eSPI@2.5.43
  h2zero/NimBLE-Arduino@2.5.1

build_flags =
  -D LV_CONF_INCLUDE_SIMPLE
  ; 12 for the detail rows, 16 for the view title, 34 for the big percentage.
  ; Was 10/14/34 - bumped one step for legibility at desk distance, which the
  ; round panel can afford because each view shows one headline number rather
  ; than the seven rows the 10px size was chosen for. Usable width inside the
  ; arc is only ~150px at mid-height and less towards the edges, so this is
  ; about as far as the small rows can go without wrapping. 10 and 14 are gone
  ; rather than left enabled: unused fonts are dead weight, and LV_FONT_DEFAULT
  ; in lv_conf.h moved to 12 to match.
  -D LV_FONT_MONTSERRAT_12=1
  -D LV_FONT_MONTSERRAT_16=1
  -D LV_FONT_MONTSERRAT_34=1
  ; Runtime display tuning (pinout/driver are defined in lib/TFT_eSPI_Setup/User_Setup.h)
  -D LVGL_TFT_ROTATION=0
  -D LVGL_TFT_INVERT_COLORS=1
  -I .
  ; Force TFT_eSPI to use our persistent pin/driver config instead of its bundled
  ; User_Setup.h, so it survives switching `board =` above to a different ESP32 variant.
  -D USER_SETUP_LOADED=1
  -include lib/TFT_eSPI_Setup/User_Setup.h
  ; NimBLE, not the default Bluedroid stack (see docs/handover.md #2) - saves
  ; ~100KB flash and a large amount of RAM, which matters on a non-S3, no-PSRAM board.
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  ; LVGL 9.5's bundled ThorVG omits <cstring>, which GCC 14 no longer supplies
  ; transitively - it fails on unqualified memcpy without this. string.h (not
  ; cstring) because this flag also applies to the C sources.
  -include string.h
  ; Uncomment to cycle every crab mood on a timer. Real quota states take hours
  ; to reach, so this is the only practical way to check each animation loads
  ; and renders within the heap budget. Watch the [mem] line while it runs.
  ; -D CRAB_MOOD_DEMO=1
