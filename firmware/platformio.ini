[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
  lvgl/lvgl@^9.5.0
  bodmer/TFT_eSPI@^2.5.43
  h2zero/NimBLE-Arduino@^2.2.3

build_flags =
  -D LV_CONF_INCLUDE_SIMPLE
  ; Only font 10 is used: the verbose layout packs ~7 rows inside the arc, and
  ; the usable width inside a 220px arc on a round panel is only ~135px, so
  ; larger fonts overflow into the rim. Fonts 24/48 were dropped once the big
  ; single-numeral layout went away — each unused font is dead flash.
  -D LV_FONT_MONTSERRAT_10=1
  ; Runtime display tuning (pinout/driver are defined in lib/TFT_eSPI_Setup/User_Setup.h)
  -D LVGL_TFT_ROTATION=0
  -D LVGL_TFT_INVERT_COLORS=1
  -I .
  ; Force TFT_eSPI to use our persistent pin/driver config instead of its bundled
  ; User_Setup.h, so it survives switching `board =` above to a different ESP32 variant.
  -D USER_SETUP_LOADED=1
  -include lib/TFT_eSPI_Setup/User_Setup.h
  ; NimBLE, not the default Bluedroid stack (see docs/handover.md #2) — saves
  ; ~100KB flash and a large amount of RAM, which matters on a non-S3, no-PSRAM board.
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
